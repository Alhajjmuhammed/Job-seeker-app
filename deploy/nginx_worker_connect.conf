# Nginx configuration for Worker Connect
# Place this file in: /etc/nginx/sites-available/worker-connect
# Create symlink: sudo ln -s /etc/nginx/sites-available/worker-connect /etc/nginx/sites-enabled/

upstream worker_connect_app {
    server 127.0.0.1:8001 fail_timeout=0;
}

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;  # CHANGE THIS
    
    client_max_body_size 20M;
    
    # Logs
    access_log /var/www/worker-connect/logs/nginx-access.log;
    error_log /var/www/worker-connect/logs/nginx-error.log;

    # Static files
    location /static/ {
        alias /var/www/worker-connect/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias /var/www/worker-connect/media/;
        expires 30d;
    }

    # Django app
    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_pass http://worker_connect_app;
    }
}

