# Nginx configuration for Worker Connect
# Place this file in: /etc/nginx/sites-available/worker-connect
# Create symlink: sudo ln -s /etc/nginx/sites-available/worker-connect /etc/nginx/sites-enabled/
#
# Two backend services, matching worker-connect.service (Gunicorn/WSGI,
# port 8003) and worker-connect-daphne.service (Daphne/ASGI, port 8004):
# regular HTTP goes to Gunicorn, WebSocket connections under /ws/ go to
# Daphne. Gunicorn (WSGI) cannot handle a WebSocket upgrade at all, so
# without this split, real-time notifications silently never work even
# though the rest of the site looks fine.

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;  # CHANGE THIS

    client_max_body_size 20M;

    # Logs
    access_log /var/www/worker-connect/logs/nginx-access.log;
    error_log /var/www/worker-connect/logs/nginx-error.log;

    # Static files
    location /static/ {
        alias /var/www/worker-connect/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias /var/www/worker-connect/media/;
        expires 30d;
    }

    # WebSocket connections - must go to Daphne (ASGI), not Gunicorn (WSGI)
    location /ws/ {
        proxy_pass http://127.0.0.1:8004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Regular HTTP traffic - Gunicorn (WSGI)
    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_pass http://127.0.0.1:8003;
    }
}

# SSL configuration - in practice this is added automatically by
# `certbot --nginx` rather than hand-edited; shown here for reference.
# server {
#     listen 443 ssl http2;
#     server_name your-domain.com www.your-domain.com;
#
#     ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#
#     # ... rest of configuration same as above (static/media/ws/http blocks)
# }
