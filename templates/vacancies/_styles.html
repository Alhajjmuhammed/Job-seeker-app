<style>
  /* ---- shared look for the job-post pages (works in light + dark) ---- */
  .vc-wrap { max-width: 1100px; }
  .vc-card { background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-radius: 14px; }
  .vc-card-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; flex-wrap: wrap;
                  padding: .85rem 1.1rem; border-bottom: 1px solid var(--bs-border-color); }
  .vc-card-head h2 { font-size: .95rem; font-weight: 700; margin: 0; }
  .vc-card-head small { color: var(--bs-secondary-color); font-size: .76rem; }
  .vc-card-body { padding: 1rem 1.1rem; }
  .vc-muted { color: var(--bs-secondary-color); }
  .vc-title a { color: #0f766e; }
  [data-bs-theme="dark"] .vc-title a { color: #5eead4; }
  .vc-title { font-size: 1.15rem; font-weight: 800; margin: 0; line-height: 1.25; word-break: break-word; }
  .vc-meta { display: flex; flex-wrap: wrap; gap: .3rem .9rem; font-size: .8rem; color: var(--bs-secondary-color); }
  .vc-meta i { margin-right: .25rem; color: #0f766e; }
  .vc-pay { font-weight: 800; color: #0f766e; font-size: 1rem; }
  [data-bs-theme="dark"] .vc-pay, [data-bs-theme="dark"] .vc-meta i { color: #5eead4; }

  /* status pills */
  .vc-st { display: inline-block; font-size: .66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
           padding: .22rem .6rem; border-radius: 999px; white-space: nowrap; background: var(--bs-tertiary-bg); color: var(--bs-body-color); }
  .vc-st-review, .vc-st-applied { background: #fef3c7; color: #92400e; }
  .vc-st-changes, .vc-st-shortlisted { background: #e0e7ff; color: #3730a3; }
  .vc-st-published, .vc-st-hired, .vc-st-active { background: #d1fae5; color: #065f46; }
  .vc-st-rejected, .vc-st-not_selected, .vc-st-ended_early { background: #fee2e2; color: #991b1b; }
  .vc-st-filled, .vc-st-finished, .vc-st-renewed { background: #cffafe; color: #155e75; }
  .vc-st-closed, .vc-st-withdrawn { background: var(--bs-tertiary-bg); color: var(--bs-secondary-color); }
  [data-bs-theme="dark"] .vc-st-review, [data-bs-theme="dark"] .vc-st-applied { background: rgba(245, 158, 11, .18); color: #fcd34d; }
  [data-bs-theme="dark"] .vc-st-changes, [data-bs-theme="dark"] .vc-st-shortlisted { background: rgba(99, 102, 241, .2); color: #c7d2fe; }
  [data-bs-theme="dark"] .vc-st-published, [data-bs-theme="dark"] .vc-st-hired, [data-bs-theme="dark"] .vc-st-active { background: rgba(16, 185, 129, .18); color: #6ee7b7; }
  [data-bs-theme="dark"] .vc-st-rejected, [data-bs-theme="dark"] .vc-st-not_selected, [data-bs-theme="dark"] .vc-st-ended_early { background: rgba(239, 68, 68, .18); color: #fca5a5; }
  [data-bs-theme="dark"] .vc-st-filled, [data-bs-theme="dark"] .vc-st-finished, [data-bs-theme="dark"] .vc-st-renewed { background: rgba(6, 182, 212, .18); color: #67e8f9; }

  /* small tags (live-in, food, trade...) */
  .vc-tag { display: inline-flex; align-items: center; gap: .25rem; font-size: .72rem; padding: .15rem .55rem; margin: .15rem .2rem 0 0;
            border-radius: 999px; background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
  .vc-tag.alt { background: #eff6ff; color: #1e40af; border-color: #bfdbfe; }
  [data-bs-theme="dark"] .vc-tag { background: rgba(16, 185, 129, .12); color: #6ee7b7; border-color: rgba(16, 185, 129, .3); }
  [data-bs-theme="dark"] .vc-tag.alt { background: rgba(59, 130, 246, .14); color: #93c5fd; border-color: rgba(59, 130, 246, .3); }

  /* facts list */
  .vc-facts { margin: 0; }
  .vc-fact { display: flex; gap: .75rem; padding: .55rem 0; border-bottom: 1px dashed var(--bs-border-color); }
  .vc-fact:last-child { border-bottom: 0; }
  .vc-fact > i { color: #0f766e; width: 18px; text-align: center; margin-top: .15rem; }
  [data-bs-theme="dark"] .vc-fact > i { color: #5eead4; }
  .vc-fact dt { font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--bs-secondary-color); margin: 0; }
  .vc-fact dd { margin: 0; font-size: .88rem; word-break: break-word; white-space: pre-line; }

  /* job cards on the board / lists */
  .vc-job { display: block; text-decoration: none; color: inherit; padding: 1rem 1.1rem; transition: border-color .15s, box-shadow .15s; height: 100%; }
  .vc-job:hover { border-color: #14b8a6; box-shadow: 0 4px 16px rgba(15, 118, 110, .08); color: inherit; }
  .vc-job-top { display: flex; justify-content: space-between; gap: .5rem; align-items: flex-start; }
  .vc-job h3 { font-size: .98rem; font-weight: 700; margin: 0 0 .2rem; word-break: break-word; }

  /* applicants */
  .vc-app { padding: 1rem 1.1rem; border-bottom: 1px solid var(--bs-border-color); }
  .vc-app:last-child { border-bottom: 0; }
  .vc-avatar { width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
               font-weight: 700; color: #fff; background: #0f766e; font-size: 1.1rem; }
  .vc-msg { font-size: .85rem; background: var(--bs-tertiary-bg); border-radius: 10px; padding: .55rem .75rem; margin-top: .5rem; white-space: pre-line; }
  .vc-tabs { display: flex; gap: .35rem; flex-wrap: wrap; }
  .vc-tabs a { font-size: .78rem; font-weight: 600; padding: .3rem .7rem; border-radius: 999px; text-decoration: none;
               color: var(--bs-secondary-color); border: 1px solid var(--bs-border-color); }
  .vc-tabs a.active { background: #0f766e; color: #fff !important; border-color: #0f766e; }

  /* banners */
  .vc-banner { display: flex; gap: .75rem; align-items: flex-start; border-radius: 12px; padding: .85rem 1rem; border: 1px solid var(--bs-border-color); }
  .vc-banner i { font-size: 1.25rem; }
  .vc-banner.review { background: #fffbeb; border-color: #fde68a; color: #78350f; }
  .vc-banner.changes { background: #eef2ff; border-color: #c7d2fe; color: #312e81; }
  .vc-banner.rejected { background: #fef2f2; border-color: #fecaca; color: #7f1d1d; }
  .vc-banner.published { background: #ecfdf5; border-color: #a7f3d0; color: #064e3b; }
  .vc-banner.filled, .vc-banner.closed { background: var(--bs-tertiary-bg); color: var(--bs-body-color); }
  [data-bs-theme="dark"] .vc-banner.review { background: rgba(245, 158, 11, .1); border-color: rgba(245, 158, 11, .3); color: #fde68a; }
  [data-bs-theme="dark"] .vc-banner.changes { background: rgba(99, 102, 241, .12); border-color: rgba(99, 102, 241, .35); color: #c7d2fe; }
  [data-bs-theme="dark"] .vc-banner.rejected { background: rgba(239, 68, 68, .1); border-color: rgba(239, 68, 68, .3); color: #fecaca; }
  [data-bs-theme="dark"] .vc-banner.published { background: rgba(16, 185, 129, .1); border-color: rgba(16, 185, 129, .3); color: #a7f3d0; }

  .vc-empty { padding: 2.5rem 1.25rem; text-align: center; }
  .vc-empty .ico { width: 58px; height: 58px; border-radius: 16px; margin: 0 auto .8rem; display: flex; align-items: center; justify-content: center;
                   font-size: 1.5rem; background: #ecfdf5; color: #0f766e; }
  [data-bs-theme="dark"] .vc-empty .ico { background: rgba(16, 185, 129, .14); color: #5eead4; }
  .vc-empty h3 { font-size: 1rem; font-weight: 700; margin-bottom: .3rem; }
  .vc-empty p { font-size: .85rem; color: var(--bs-secondary-color); max-width: 440px; margin: 0 auto 1rem; }

  .vc-btn { border-radius: 9px; font-weight: 600; font-size: .84rem; }
  [data-bs-theme="dark"] .vc-btn.btn-outline-success { color: #5eead4 !important; border-color: rgba(94, 234, 212, .45); }
  [data-bs-theme="dark"] .vc-btn.btn-outline-success:hover { background: rgba(20, 184, 166, .15); color: #99f6e4 !important; }
  [data-bs-theme="dark"] .vc-btn.btn-outline-primary { color: #93c5fd !important; border-color: rgba(147, 197, 253, .45); }
  [data-bs-theme="dark"] .vc-btn.btn-outline-danger { color: #fca5a5 !important; border-color: rgba(252, 165, 165, .45); }
  [data-bs-theme="dark"] .vc-btn.btn-outline-secondary { color: #cbd5e1 !important; border-color: rgba(203, 213, 225, .35); }
  [data-bs-theme="dark"] .vc-btn.btn-light { background: var(--bs-tertiary-bg); color: var(--bs-body-color); border-color: var(--bs-border-color); }
  .vc-table td, .vc-table th { vertical-align: middle; font-size: .86rem; }
  .vc-table th { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--bs-secondary-color); font-weight: 600; }
  .vc-stars { color: #f59e0b; letter-spacing: .05em; }
  .vc-rate input { display: none; }
  .vc-rate { display: inline-flex; flex-direction: row-reverse; gap: .15rem; font-size: 1.6rem; }
  .vc-rate label { cursor: pointer; color: var(--bs-border-color); }
  .vc-rate input:checked ~ label, .vc-rate label:hover, .vc-rate label:hover ~ label { color: #f59e0b; }
  @media (max-width: 575.98px) {
    .vc-card-body, .vc-card-head, .vc-app, .vc-job { padding-left: .85rem; padding-right: .85rem; }
    .vc-actions .btn { flex: 1 1 auto; }
  }
</style>
